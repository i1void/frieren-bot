name: Feature Request
description: Suggest a new command or an improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the command or change.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Why is it useful?
      description: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: How would you use it? A sample command and reply helps.
      placeholder: |
        .example hello
        -> Hello!
