name: Bug Report
description: Something does not work as expected
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can.
        **Never post your `session/` folder, your database file, or full phone numbers.**
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you used, exactly as you sent it.
      placeholder: .menfess 628123456789 | hello
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send ...
        2. Then ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console log / error
      description: Output from the console or `pm2 logs frieren-bot`. Remove private data first.
      render: shell
  - type: input
    id: baileys
    attributes:
      label: Baileys version
      description: The version in your `package.json`.
      placeholder: 6.7.24
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v` (22.13 or newer is required).
      placeholder: v22.13.0
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: How do you run the bot?
      options:
        - PM2
        - npm start
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Termux, Windows 11, ...
  - type: dropdown
    id: scope
    attributes:
      label: Where did it happen?
      options:
        - Private chat
        - Group chat
        - Both
        - Not sure
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am using the latest version of this bot.
          required: true
        - label: I read the README and did not find the answer there.
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I checked the Baileys issues and the problem is not from Baileys.
          required: true
        - label: I gave enough information. If my report is unclear, it is fine if it gets no response.
          required: true
