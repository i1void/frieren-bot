name: PR Helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-helper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  API_URL: https://i-1v.web.id
  API_KEY: ${{ secrets.API_KEY }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Blok PR dari fork (secrets tidak tersedia di sana)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1.11.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Update PR Title and Body
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" | head -c 5000 > diff.txt
          [ -s diff.txt ] || { echo "Diff kosong, skip"; exit 0; }

          CONTENT=$(curl -sf --max-time 60 --retry 2 --retry-all-errors --retry-delay 2 \
            -X POST "$API_URL/api/ai/revisi" \
            -H "x-apikey: $API_KEY" \
            --data-urlencode "prompt@diff.txt" \
            | jq -r '.data.message // empty') || CONTENT=""

          [ -n "$CONTENT" ] || { echo "API gagal, skip"; exit 0; }

          TITLE=$(printf '%s\n' "$CONTENT" | head -n 1)
          printf '%s\n' "$CONTENT" | tail -n +3 > pr_body.txt
          [ -s pr_body.txt ] || printf '%s\n' "$CONTENT" | tail -n +2 > pr_body.txt

          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --body-file pr_body.txt

      - name: Code Review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" | head -c 5000 > diff.txt
          [ -s diff.txt ] || { echo "Diff kosong, skip"; exit 0; }

          MESSAGE=$(curl -sf --max-time 60 --retry 2 --retry-all-errors --retry-delay 2 \
            -X POST "$API_URL/api/ai/review" \
            -H "x-apikey: $API_KEY" \
            --data-urlencode "prompt@diff.txt" \
            | jq -r '.data.message // empty') || MESSAGE=""

          [ -n "$MESSAGE" ] || { echo "API gagal, skip"; exit 0; }

          printf '### Code Review\n\n%s\n' "$MESSAGE" > review.md

          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body-file review.md --edit-last --create-if-none

      - name: Approve PR
        if: github.event.pull_request.user.login == 'i1void' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" \
            --approve --body "Auto-approved by frieren-grimoire."

      - name: Merge PR
        if: github.event.pull_request.user.login == 'i1void' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TITLE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch --subject "$TITLE (#$PR)"
